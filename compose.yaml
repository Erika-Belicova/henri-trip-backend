services:
  postgres:
    image: postgres:18.6
    container_name: henri-trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: henri_trip
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: